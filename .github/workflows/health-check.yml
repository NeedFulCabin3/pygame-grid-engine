# CI workflow performs headless syntax checking and linting without launching display servers or audio devices.
name: Python Code Health CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pygame

    - name: Code Linting and Syntax Analysis
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings for code style
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Headless Engine Initialization Test
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
      run: |
        python -c "import pygame; pygame.init(); print('Pygame headless context verified successfully.')"